name: songtube
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 7.4.0+6000

environment:
  sdk: ">=3.10.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Tools
  url_launcher: ^6.3.2
  http: ^1.6.0
  intl: ^0.20.2
  validators: ^3.0.0
  # NOTE: the *_plus family is held one major back by win32. Their latest majors
  # (share_plus 13, device_info_plus 13, package_info_plus 10.1, network_info_plus 8)
  # all require win32 ^6, while file_picker 11.x (newest stable) still pins win32 ^5.9.0.
  # Bump these together once file_picker ships a stable release on win32 ^6.
  share_plus: ^12.0.2
  device_info_plus: ^12.4.0
  volume_controller: ^3.5.0
  screen_brightness: ^2.1.11
  flutter_keyboard_visibility: ^6.0.0
  file_picker: ^11.0.3
  wakelock_plus: ^1.3.4
  pick_or_save: ^2.2.4
  receive_intent: ^0.2.7
  flutter_widget_from_html_core: ^0.17.2
  parallax_sensors_bg: ^1.0.1
  android_intent_plus: ^6.1.0
  network_info_plus: ^7.0.0 # see win32 note above
  flutter_slidable: ^4.0.3
  image_picker: ^1.2.3

  # Dart advanced Streams
  rxdart: ^0.28.0

  # Google Fonts
  google_fonts: ^8.2.1

  # Custom VideoPlayer with support for Muxed Streams
  video_player:
    git:
      url: https://github.com/SongTube/video_player
      ref: master

  # Audio Tagger, Music Data Extractor
  audio_tagger:
    git:
      url: https://github.com/SongTube/audio_tagger
      ref: main

  # CrossFade Images
  image_fade:
    git:
      url: https://github.com/SongTube/image_fade.git
      ref: master

  # Audio Query, Extract Music from device
  on_audio_query: ^2.9.0

  # Shared Preferences, Save user settings and cache things
  shared_preferences: ^2.5.5

  # Permisisons Managing
  # 13.x pulls permission_handler_android 14, which requires AGP 9.0.1 / Kotlin 2.3.20 /
  # compileSdk 37 -- ahead of Flutter 3.41 stable. Bump once the app moves to AGP 9.
  permission_handler: ^12.0.3

  # App Paths Provider
  path_provider: ^2.1.6
  android_path_provider: ^0.3.2

  # Provider Package
  provider: ^6.1.5

  # Audio Service, for playing music on background
  audio_service: ^0.18.19

  # Just Audio, to actually play and handle Music
  just_audio: ^0.10.6

  # Some Fancy Icons
  eva_icons_flutter: ^4.0.0
  line_icons: ^2.0.3
  ionicons: ^0.2.2
  iconsax: ^0.0.8
  material_design_icons_flutter: ^7.0.7296

  # Transparent Image as ByteArray
  transparent_image: ^2.0.1

  # Extract primary colors from Images
  palette_generator: ^0.3.3+7

  # Animation Packages
  flutter_bounce: ^1.1.0
  animations: ^2.2.0

  # ID Generator
  uuid: ^4.6.0

  # Aditional UI Stuff I'm too lazy to do myself
  roundcheckbox: ^2.0.5
  grouped_list: ^6.0.0
  timeago: ^3.7.1
  dynamic_color: ^1.8.1
  #animated_theme_switcher: ^2.0.7
  draggable_scrollbar: ^0.1.0

  # NewPipe Extractor
  newpipeextractor_dart:
    git:
      url: https://github.com/SongTube/NewPipeExtractor_Dart
      ref: master

  # Apk installer
  apk_installer:
    git:
      url: https://github.com/SongTube/apk_installer.git
      ref: main

  # For InApp update
  package_info_plus: ^9.0.1 # see win32 note above
  flutter_markdown_plus: ^1.0.12
  avatar_glow: ^3.0.1

  # FFmpeg
  ffmpeg_kit_flutter_new_audio: ^2.5.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
      - assets/images/
      - assets/LICENSE

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  fonts:
      - family: YTSans
        fonts:
            - asset: assets/fonts/youtube-sans-medium.ttf
              weight: 500
            - asset: assets/fonts/youtube-sans-light.ttf
              weight: 300
            - asset: assets/fonts/youtube-sans-bold.ttf
              weight: 700
      - family: Product Sans
        fonts:
            - asset: assets/fonts/productSans/bold.ttf
              weight: 700
            - asset: assets/fonts/productSans/regular.ttf
              weight: 400
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

dependency_overrides:
  # parallax_sensors_bg 1.0.1 (abandoned) pins sensors_plus ^2.0.1, whose Kotlin
  # no longer compiles under Kotlin 2.2. 5.0.1 still exposes the deprecated
  # accelerometerEvents/gyroscopeEvents streams that parallax_sensors_bg uses.
  sensors_plus: ^5.0.1
